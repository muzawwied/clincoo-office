<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b3545;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{display:block}
:root{--hud-bg:rgba(15,23,42,.66);--hud-bd:rgba(226,232,240,.18);--hud-tx:#e2e8f0;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
button{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.glass{background:var(--hud-bg);border:1px solid var(--hud-bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(2,6,23,.35),inset 0 1px 0 rgba(255,255,255,.08)}

/* ---------- HUD mode kendali karakter ---------- */
.ctl{position:fixed;inset:0;pointer-events:none;z-index:6;user-select:none;-webkit-user-select:none}
.joy{pointer-events:auto;position:absolute;left:calc(26px + var(--sl));bottom:calc(24px + var(--sb));width:132px;height:132px;border-radius:50%;touch-action:none;color:rgba(226,232,240,.38);box-sizing:border-box;
  background:radial-gradient(circle,rgba(15,23,42,.18) 0 36%,rgba(15,23,42,.5) 100%);border:2px solid rgba(226,232,240,.28);box-shadow:inset 0 0 24px rgba(2,6,23,.45),0 6px 18px rgba(2,6,23,.3);transition:border-color .15s}
.joy.act{border-color:rgba(147,181,255,.8)}
.jarr{position:absolute;inset:0;width:100%;height:100%;fill:currentColor;pointer-events:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 28%,#fff,#cbd5e1 58%,#94a3b8);box-shadow:0 4px 10px rgba(2,6,23,.5);transition:transform .14s ease-out}
.joy.act .knob{transition:none}
.hbtn{pointer-events:auto;position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:50%;padding:0;box-sizing:border-box;
  color:var(--hud-tx);font:800 9px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;touch-action:manipulation;cursor:pointer;transition:transform .1s,opacity .15s,filter .15s}
.hbtn:active{transform:scale(.9);filter:brightness(1.15)}
.hbtn svg{display:block}
.jump{right:calc(28px + var(--sr));bottom:calc(28px + var(--sb));width:78px;height:78px;color:#fff;border:2px solid rgba(255,255,255,.6);
  background:linear-gradient(160deg,#6b93ff,#3b63e8);box-shadow:0 8px 20px rgba(37,99,235,.45),inset 0 2px 0 rgba(255,255,255,.35)}
.aksi{right:calc(122px + var(--sr));bottom:calc(34px + var(--sb));width:60px;height:60px}
.stair{right:calc(37px + var(--sr));bottom:calc(122px + var(--sb));width:60px;height:60px;color:#fff;border:2px solid rgba(255,255,255,.55);
  background:linear-gradient(160deg,#34d399,#0f9f78);box-shadow:0 8px 18px rgba(16,185,129,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.tiny{top:calc(12px + var(--st));width:42px;height:42px}
.tiny.exit{right:calc(12px + var(--sr));color:#fca5a5}

.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--st)) calc(16px + var(--sr)) calc(12px + var(--sb)) calc(16px + var(--sl));box-sizing:border-box;
  background:rgba(2,6,23,.5);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
.menu.open{opacity:1;visibility:visible;pointer-events:auto}
.panel{width:min(560px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;padding:12px 12px 14px;border-radius:22px;transform:scale(.94);transition:transform .22s cubic-bezier(.2,.8,.2,1);scrollbar-width:none;touch-action:pan-y}
.panel::-webkit-scrollbar{display:none}
.menu.open .panel{transform:scale(1)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;color:#f8fafc;font:800 13px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.phead .x{width:32px;height:32px;border-radius:50%;border:1px solid var(--hud-bd);background:rgba(255,255,255,.08);color:var(--hud-tx);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{height:66px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--hud-tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 2px;
  font:700 10px/1 system-ui,sans-serif;touch-action:manipulation;cursor:pointer;transition:transform .1s,background .15s,border-color .15s}
.tile:active{transform:scale(.94)}
.tile svg{display:block}
.tile.on{color:#fff;border-color:rgba(255,255,255,.55);background:linear-gradient(160deg,#6b93ff,#3b63e8);box-shadow:0 4px 12px rgba(37,99,235,.4)}
@media (max-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-height:430px){.joy{width:118px;height:118px;bottom:calc(16px + var(--sb))}.knob{width:50px;height:50px;margin:-25px 0 0 -25px}
  .jump{width:70px;height:70px;bottom:calc(20px + var(--sb))}.aksi{width:54px;height:54px;right:calc(112px + var(--sr));bottom:calc(26px + var(--sb))}.stair{width:54px;height:54px;bottom:calc(104px + var(--sb))}.tile{height:58px}}

/* ---------- caption / papan nama karakter ---------- */
.nt{position:absolute;left:0;top:0;display:none;pointer-events:auto;cursor:pointer;will-change:transform;user-select:none;-webkit-user-select:none;text-align:center;min-width:56px;box-sizing:border-box;
  padding:4px 11px 5px;border-radius:10px;background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(15,23,42,.9));border:1px solid rgba(226,232,240,.22);box-shadow:0 4px 12px rgba(2,6,23,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nt::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:rgba(15,23,42,.92);border-right:1px solid rgba(226,232,240,.22);border-bottom:1px solid rgba(226,232,240,.22);transform:translateX(-50%) rotate(45deg)}
.nt .n{display:flex;align-items:center;justify-content:center;gap:5px;color:#f8fafc;font:700 12px/1.15 system-ui,sans-serif}
.nt .n i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--dc,#4f7cff);box-shadow:0 0 6px var(--dc,#4f7cff)}
.nt .r{margin-top:3px;color:#93c5fd;font:700 8.5px/1 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase}

/* ---------- HUD umum ---------- */
.clock{position:fixed;left:calc(12px + var(--sl));top:calc(12px + var(--st));z-index:7;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;color:var(--hud-tx);font:700 14px system-ui,sans-serif;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.floorbar{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;z-index:5;font:700 13px system-ui,sans-serif}
.floorbar button{border:0;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;background:transparent;color:#e2e8f0;touch-action:manipulation;transition:background .15s,color .15s}

/* ---------- layar putar ke landscape ---------- */
#rot{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center;color:#e2e8f0;
  background:radial-gradient(circle at 50% 38%,#1e293b,#0b1220);font:600 15px/1.4 system-ui,sans-serif;touch-action:manipulation}
#rot.show{display:flex}
#rot .ph{width:46px;height:78px;border:3px solid #e2e8f0;border-radius:11px;position:relative;margin-bottom:6px;animation:rotph 2.6s ease-in-out infinite}
#rot .ph::after{content:"";position:absolute;left:50%;bottom:5px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#e2e8f0}
@keyframes rotph{0%,18%{transform:rotate(0)}55%,88%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rot h2{margin:0;font:800 19px system-ui,sans-serif}
#rot p{margin:0;max-width:300px;font-weight:500;color:#94a3b8;font-size:13px}
#rot .cta{margin-top:6px;border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:12px 24px;color:#fff;font:800 14px system-ui,sans-serif;cursor:pointer;background:linear-gradient(160deg,#6b93ff,#3b63e8);box-shadow:0 8px 20px rgba(37,99,235,.45)}
#rot .ghost{border:0;background:transparent;color:#64748b;font:600 12px system-ui,sans-serif;padding:8px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<script>
let scene, camera, renderer, controls;
let g1, g2, g3, cols, shell1;
let floorBtns = [];
const leds = [];
const K = 1.3;          // skala furnitur
const FH = 3.6, FY = [0, 3.6, 7.2];         // tinggi antar lantai
let seed = 11;
function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

/* ===== KARAKTER, NAVIGASI & AKTIVITAS ===== */
const S_CH = 1.3, HIP = 0.89, WALK_V = 2.0, CS = 0.3, NR = 0.36;
const GX0 = -29, GZ0 = -21, GW = 194, GH = 140;
const blk = [0, 1, 2].map(() => new Uint8Array(GW * GH));
const reach = [0, 1, 2].map(() => new Uint8Array(GW * GH));
const blkM = [0, 1, 2].map(() => new Uint8Array(GW * GH)), hgt = [0, 1, 2].map(() => new Float32Array(GW * GH)), RM = 0.24;
const seatReg = [];
let zv = 0;
const STAIRS = [{x:-17.5, zb:19, zt:11, lo:0, hi:1}, {x:24.5, zb:5, zt:-3, lo:1, hi:2}];
STAIRS.forEach(S => { S.nb = {x:S.x, z:S.zb + 0.3}; S.nt = {x:S.x, z:S.zt - 0.6}; });
let curStair = null;
let player, rig, tors, P = {}, POIS = [], wsSeats = [], curFloor = 0, viewFloor = 1;
let st = 'WAIT', stT = 0, waitDur = 1.5, actDur = 10, path = [], poi = null, lastPoi = null, sit0 = null;
let pFloor = 0, floorY = 0, climb = 0, walkPh = 0, yawNow = 0, hudEl = null;
let lastTime = 0;
const POSE0 = {rx:0, py:0, pz:0, tp:0, hl:0, hr:0, kl:0, kr:0, sl:0, sr:0, zl:-0.06, zr:0.06, el:-0.1, er:-0.1, hx:0, hy:0, eye:1};
let pose = Object.assign({}, POSE0), blkT = 0, ghostT = 0;
const gi = (ix, iz) => iz * GW + ix;
const cellOf = (x, z) => [Math.floor((x - GX0) / CS), Math.floor((z - GZ0) / CS)];
const inG = (ix, iz) => ix >= 0 && iz >= 0 && ix < GW && iz < GH;
const ccx = ix => GX0 + (ix + 0.5) * CS, ccz = iz => GZ0 + (iz + 0.5) * CS;
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
function cellTopM(f, x, z){ const c = cellOf(x, z); if(!inG(c[0], c[1])) return 99; const k = gi(c[0], c[1]); return blkM[f][k] ? 99 : hgt[f][k]; }
function isFree(f, x, z){ const c = cellOf(x, z); return inG(c[0], c[1]) && !blk[f][gi(c[0], c[1])]; }
function rch(f, x, z){ const c = cellOf(x, z); return inG(c[0], c[1]) && reach[f][gi(c[0], c[1])] === 1; }
function snap(f, x, z, rad, needReach){
  const c = cellOf(x, z); let best = null, bd = 1e9;
  for(let dz = -rad; dz <= rad; dz++) for(let dx = -rad; dx <= rad; dx++){
    const ix = c[0] + dx, iz = c[1] + dz; if(!inG(ix, iz)) continue;
    const k = gi(ix, iz); if(blk[f][k] || (needReach && !reach[f][k])) continue;
    const d = dx * dx + dz * dz; if(d < bd){ bd = d; best = [ix, iz]; }
  }
  return best;
}
function los(f, x0, z0, x1, z1){
  const L = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.ceil(L / 0.06)), px = L > 0 ? -(z1 - z0) / L * 0.1 : 0, pz = L > 0 ? (x1 - x0) / L * 0.1 : 0;
  for(let i = 0; i <= n; i++){
    const u = i / n, x = x0 + (x1 - x0) * u, z = z0 + (z1 - z0) * u;
    if(!isFree(f, x, z) || !isFree(f, x + px, z + pz) || !isFree(f, x - px, z - pz)) return false;
  }
  return true;
}
function clearTo(f, x0, z0, x1, z1){   // segmen bebas, kecuali dekat kursi tujuan
  const n = Math.ceil(Math.hypot(x1 - x0, z1 - z0) / 0.1);
  for(let i = 0; i <= n; i++){
    const x = x0 + (x1 - x0) * i / n, z = z0 + (z1 - z0) * i / n;
    if(Math.hypot(x1 - x, z1 - z) < 1.5) break;
    if(!isFree(f, x, z)) return false;
  }
  return true;
}

function buildNav(){
  const roots = [[shell1, g1], [g2], [g3]], box = new THREE.Box3();
  roots.forEach((rs, f) => {
    const fy = FY[f], b = blk[f];
    const fill = (xa, xb, za, zb, v) => {
      for(let iz = Math.max(0, Math.floor((za - GZ0) / CS)); iz <= Math.min(GH - 1, Math.floor((zb - GZ0) / CS)); iz++)
        for(let ix = Math.max(0, Math.floor((xa - GX0) / CS)); ix <= Math.min(GW - 1, Math.floor((xb - GX0) / CS)); ix++) b[gi(ix, iz)] = v;
    };
    const bm = blkM[f], hm = hgt[f];
    const fillM = (xa, xb, za, zb, val) => {
      for(let iz = Math.max(0, Math.floor((za - GZ0) / CS)); iz <= Math.min(GH - 1, Math.floor((zb - GZ0) / CS)); iz++)
        for(let ix = Math.max(0, Math.floor((xa - GX0) / CS)); ix <= Math.min(GW - 1, Math.floor((xb - GX0) / CS)); ix++){
          const k = gi(ix, iz); if(val < 0) bm[k] = 1; else if(val > hm[k]) hm[k] = val;
        }
    };
    rs.forEach(r => r.traverse(o => {
      if(!o.isMesh || o.userData.walk) return;
      box.setFromObject(o);
      { const mx = box.max.y - fy, mn = box.min.y - fy;
        if(mx > 0.12 && mn < 1.9){
          const wd = Math.min(box.max.x - box.min.x, box.max.z - box.min.z);
          const solid = o.material === glassM || mx > 1.3 || (wd < 0.15 && mx - mn > 0.8);
          fillM(box.min.x - RM, box.max.x + RM, box.min.z - RM, box.max.z + RM, solid ? -1 : mx);
        } }
      if(box.max.y - fy < 0.3 || box.min.y - fy > 1.9) return;
      fill(box.min.x - NR, box.max.x + NR, box.min.z - NR, box.max.z + NR, 1);
    }));
    for(let iz = 0; iz < GH; iz++) for(let ix = 0; ix < GW; ix++){          // batas bangunan
      const x = ccx(ix), z = ccz(iz);
      if(x < -27.6 || x > 27.6 || z < -19.6 || z > (f === 2 ? 7.65 : 19.7)){ b[gi(ix, iz)] = 1; bm[gi(ix, iz)] = 1; }
    }
    STAIRS.forEach(S => {                                        // area tangga: hanya lewat jalur tangga
      if(f !== S.lo && f !== S.hi) return;
      fillM(S.x - 1.05 - RM, S.x + 1.05 + RM, S.zt - RM, S.zb, -1); fill(S.x - 1.05 - NR, S.x + 1.05 + NR, S.zt - NR, S.zb, 1);
    });
    STAIRS.forEach(S => { if(f === S.lo) fill(S.x - 1.9, S.x + 1.1, S.zb + 0.05, S.zb + 0.5, 0); });   // pelataran kaki tangga
  });
  const seeds = [[], [], []]; STAIRS.forEach(S => { seeds[S.lo].push(S.nb); seeds[S.hi].push(S.nt); });
  seeds.forEach((arr, f) => arr.forEach(n => {
    const q = snap(f, n.x, n.z, 4, false); n.x = ccx(q[0]); n.z = ccz(q[1]);
    const qu = [gi(q[0], q[1])]; reach[f][qu[0]] = 1;
    for(let h = 0; h < qu.length; h++){
      const k = qu[h], ix = k % GW, iz = (k / GW) | 0;
      for(let dz = -1; dz <= 1; dz++) for(let dx = -1; dx <= 1; dx++){
        const a = ix + dx, c = iz + dz; if(!inG(a, c)) continue;
        const j = gi(a, c); if(blk[f][j] || reach[f][j]) continue;
        if(dx && dz && (blk[f][gi(ix + dx, iz)] || blk[f][gi(ix, iz + dz)])) continue;
        reach[f][j] = 1; qu.push(j);
      }
    }
  }));
}

function astar(f, x0, z0, x1, z1){
  const b = blk[f], N = GW * GH, a = cellOf(x0, z0), e = cellOf(x1, z1);
  let s = gi(a[0], a[1]), t = gi(e[0], e[1]);
  if(!inG(a[0], a[1]) || b[s]){ const q = snap(f, x0, z0, 5, true); if(!q) return null; s = gi(q[0], q[1]); }
  if(!inG(e[0], e[1]) || b[t]){ const q = snap(f, x1, z1, 5, true); if(!q) return null; t = gi(q[0], q[1]); }
  const g = new Float32Array(N).fill(1e9), par = new Int32Array(N).fill(-1), cl = new Uint8Array(N);
  const tx = t % GW, tz = (t / GW) | 0, H = [];
  const hf = k => { const dx = Math.abs(k % GW - tx), dz = Math.abs(((k / GW) | 0) - tz); return dx + dz - 0.586 * Math.min(dx, dz); };
  const push = (fv, k) => { H.push([fv, k]); let i = H.length - 1; while(i > 0){ const p = (i - 1) >> 1; if(H[p][0] <= H[i][0]) break; [H[p], H[i]] = [H[i], H[p]]; i = p; } };
  const pop = () => { const top = H[0], last = H.pop(); if(H.length){ H[0] = last; let i = 0; for(;;){ let l = 2 * i + 1, r = l + 1, m = i; if(l < H.length && H[l][0] < H[m][0]) m = l; if(r < H.length && H[r][0] < H[m][0]) m = r; if(m === i) break; [H[m], H[i]] = [H[i], H[m]]; i = m; } } return top; };
  g[s] = 0; push(hf(s), s);
  while(H.length){
    const k = pop()[1]; if(cl[k]) continue; cl[k] = 1; if(k === t) break;
    const ix = k % GW, iz = (k / GW) | 0;
    for(let dz = -1; dz <= 1; dz++) for(let dx = -1; dx <= 1; dx++){
      if(!dx && !dz) continue; const A = ix + dx, C = iz + dz; if(!inG(A, C)) continue;
      const j = gi(A, C); if(b[j] || cl[j]) continue;
      if(dx && dz && (b[gi(ix + dx, iz)] || b[gi(ix, iz + dz)])) continue;
      const ng = g[k] + (dx && dz ? 1.414 : 1);
      if(ng < g[j]){ g[j] = ng; par[j] = k; push(ng + hf(j), j); }
    }
  }
  if(par[t] < 0 && s !== t) return null;
  const cells = []; for(let k = t; k !== -1; k = par[k]) cells.push({x:ccx(k % GW), z:ccz((k / GW) | 0)});
  cells.reverse(); cells[0] = {x:x0, z:z0}; cells[cells.length - 1] = {x:x1, z:z1};
  const out = [cells[0]]; let i = 0;       // string pulling
  while(i < cells.length - 1){
    let j = cells.length - 1;
    while(j > i + 1 && !los(f, cells[i].x, cells[i].z, cells[j].x, cells[j].z)) j--;
    out.push(cells[j]); i = j;
  }
  return out;
}

/* ---- titik aktivitas ---- */
function mkPoi(act, f, sx, sz, yaw, sh, o){
  o = o || {}; let ax = sx, az = sz, ok = false;
  if(o.stand) ok = isFree(f, sx, sz) && rch(f, sx, sz);
  else {
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    for(const c of [[fz, -fx, 1.9], [-fz, fx, 1.9], [-fx, -fz, 1.9], [fx, fz, 1.9], [fz, -fx, 1.4], [-fz, fx, 1.4]]){
      const x = sx + c[0] * c[2], z = sz + c[1] * c[2];
      if(isFree(f, x, z) && rch(f, x, z) && clearTo(f, x, z, sx, sz)){ ax = x; az = z; ok = true; break; }
    }
  }
  if(!ok) return null;
  const pO = Object.assign({act, floor:f, sx, sz, yaw, sh, ax, az, sit:!o.stand && sh > 0}, o); POIS.push(pO); return pO;
}
function buildPOIs(){
  const CH = 0.52 * K, PI = Math.PI;
  const ch = (act, f, x, z, rot, pull, sh, o) => { const y = rot + PI; mkPoi(act, f, x + Math.sin(y) * pull, z + Math.cos(y) * pull, y, sh, o); };

function setFloor(n){
  viewFloor = n;
  g1.visible = true; g2.visible = n >= 2; g3.visible = n >= 3; cols.visible = n >= 2;
  controls.target.y = FY[n - 1] / 2;
  floorBtns.forEach((b, i) => {
    const on = i + 1 === n;
    b.style.background = on ? 'rgba(255,255,255,0.92)' : 'transparent';
    b.style.color = on ? '#0f172a' : '#e2e8f0';
  });
}

function makeUI(){
  const box = document.createElement('div');
  box.className = 'floorbar glass'; floorBox = box;
  ['Lantai 1', 'Lantai 2', 'Lantai 3'].forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t;
        b.addEventListener('click', () => setFloor(i + 1));
    box.appendChild(b); floorBtns.push(b);
  });
  document.body.appendChild(box);
}


/* ===== paksa landscape (tiduran) ===== */
function makeOrient(){
  const touch = matchMedia('(pointer:coarse)').matches;
  const box = document.createElement('div'); box.id = 'rot';
  box.innerHTML = '<div class="ph"></div><h2>Putar HP ke mode landscape</h2><p>Game ini paling enak dimainkan dalam posisi tidur. Kalau tidak otomatis, matikan kunci rotasi layar HP.</p><button class="cta">Layar penuh &amp; kunci landscape</button><button class="ghost">Tetap potret</button>';
  document.body.appendChild(box);
  const mq = matchMedia('(orientation: portrait)'); let skip = false;
  const upd = () => box.classList.toggle('show', touch && !skip && mq.matches);
  if(mq.addEventListener) mq.addEventListener('change', upd); else if(mq.addListener) mq.addListener(upd);
  window.addEventListener('resize', upd); window.addEventListener('orientationchange', upd);
  const go = async () => {
    const de = document.documentElement;
    try { if(!document.fullscreenElement && !document.webkitFullscreenElement){ if(de.requestFullscreen) await de.requestFullscreen({navigationUI:'hide'}); else if(de.webkitRequestFullscreen) de.webkitRequestFullscreen(); } } catch(e){}
    try { if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch(e){}
    upd();
  };
  const [bGo, bSkip] = box.querySelectorAll('button');
  bGo.addEventListener('click', go); bSkip.addEventListener('click', () => { skip = true; upd(); });
  if(touch){ const first = () => { window.removeEventListener('pointerup', first); go(); }; window.addEventListener('pointerup', first); }   // sentuhan pertama = otomatis layar penuh + kunci landscape
  upd();
}

function init(){
  scene = new THREE.Scene();

  camera.position.set(0, 58, 54);
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 10; controls.maxDistance = 130;
  controls.target.set(0, 0, 2);

  hemiL = new THREE.HemisphereLight(0xcfe0ff, 0x2a2118, 0.45); scene.add(hemiL);
  scene.add(new THREE.AmbientLight(0xffffff, 0.08));
  const sun = new THREE.DirectionalLight(0xffe4b8, 1.25);
  sun.position.set(-30, 70, 40);
  sun.castShadow = true;
  const big = window.innerWidth > 900;
  sun.shadow.mapSize.set(big ? 4096 : 2048, big ? 4096 : 2048);
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 190;
  const d = 50;
  sun.shadow.camera.left = -d; sun.shadow.camera.right = d; sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  sunL = sun; scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9ab6ff, 0.3);
  fill.position.set(40, 30, -30);
  fillL = fill; scene.add(fill);

  buildAll();
  scene.updateMatrixWorld(true);
  scene.traverse(o => { if(o.isMesh || o.isGroup) o.matrixAutoUpdate = false; });
  FXOBJ.forEach(o => { o.matrixAutoUpdate = true; });
  
  gameMin = realMin();
  buildNav(); buildPOIs(); makeChars();
  makeCtlUI(); makeClock(); makeOrient();

  makeUI();
  setFloor(1);

  window.addEventListener('keydown', e => { if(e.key === '1') setFloor(1); if(e.key === '2') setFloor(2); if(e.key === '3') setFloor(3); });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  animate(0);
}

function animate(t){
  requestAnimationFrame(animate);
  const s = (t || 0) / 1000;
  const delta = lastTime === 0 ? 0.016 : Math.min(s - lastTime, 0.1);
  lastTime = s;
  
  leds.forEach(l => l.m.color.setHex(Math.sin(s * 3 + l.ph * 5) > 0.2 ? l.on : 0x14532d).convertSRGBToLinear());
  
  advanceClock(delta); updTimeUI(); updScreens(s);
  updateAll(delta, s);

  if(pov){ loadCh(ctrlChar); povCam(delta, s); } else controls.update();
  renderer.render(scene, camera);
  updCaps();
}
window.onload = init;
